# Mirrors main to the Hugging Face Space after a push, so deploying is the
# same git push that already happens. Needs the repository secret HF_TOKEN
# (a write token) and the repository variable HF_SPACE (<user>/<space>);
# without them the job is skipped, not failed.
name: deploy-space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push-to-space:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
