name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bidproof_owner
          POSTGRES_PASSWORD: bidproof_dev
          POSTGRES_DB: bidproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidproof_owner -d bidproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bidproof_app:bidproof_app_dev@localhost:5432/bidproof
      DATABASE_URL_OWNER: postgresql+asyncpg://bidproof_owner:bidproof_dev@localhost:5432/bidproof
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: bidproof
      MINIO_SECRET_KEY: bidproof_dev_minio
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Start MinIO
        run: >-
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER=bidproof -e MINIO_ROOT_PASSWORD=bidproof_dev_minio
          minio/minio server /data
      - name: Install dependencies
        run: uv sync --project apps/api
      - name: Run tests (unit + integration)
        run: uv run --project apps/api pytest -q
      - name: Publish gold-set evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx vitest run
      - name: Build
        run: npm run build

  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install runtime dependencies only
        run: uv sync --project apps/api --no-dev
      # Permissive licences only in core (SPEC §11.4, §20). Copyleft
      # (GPL/LGPL/AGPL/SSPL/MPL) and unknown licences fail the build.
      # Reviewed exceptions (all permissive; listed because their licence
      # strings can't sit in the semicolon-separated allow list):
      #   certifi — MPL-2.0, CA certificate bundle only (approved 2026-07-16)
      #   pycryptodome — "BSD License; Public Domain"
      #   bidproof-* — this repo's own packages
      # Optional extras reviewed by hand: docling MIT, torch BSD-3,
      # paddlepaddle/paddleocr Apache-2.0, playwright Apache-2.0.
      - name: Licence gate
        run: >-
          uvx pip-licenses
          --python "$(pwd)/apps/api/.venv/bin/python"
          --allow-only "MIT;MIT License;MIT-0;BSD License;BSD-2-Clause;BSD-3-Clause;3-Clause BSD License;Apache-2.0;Apache Software License;Apache-2.0 OR BSD-2-Clause;BSD-3-Clause, Apache-2.0, dependency licenses;ISC;ISC License (ISCL);PSF-2.0;Python Software Foundation License;MIT AND PSF-2.0"
          --ignore-packages certifi pycryptodome bidproof-api bidproof-parser bidproof-adapters bidproof-scout bidproof-triage bidproof-extractor bidproof-matcher bidproof-riskscorer bidproof-decider bidproof-questionwriter bidproof-librarian bidproof-proposalwriter bidproof-factchecker
