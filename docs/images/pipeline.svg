<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>BidProof pipeline: discover, read, check, decide, draft — every output traceable to a page and a box</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- stage boxes -->
  <g stroke="#6366f1" stroke-width="1.5" fill="none">
    <rect x="20"  y="60" width="190" height="86" rx="12"/>
    <rect x="248" y="60" width="190" height="86" rx="12"/>
    <rect x="476" y="60" width="190" height="86" rx="12"/>
    <rect x="704" y="60" width="190" height="86" rx="12"/>
    <rect x="932" y="60" width="190" height="86" rx="12"/>
  </g>

  <g font-size="17" font-weight="700" fill="#6366f1" text-anchor="middle">
    <text x="115"  y="92">Discover</text>
    <text x="343"  y="92">Read</text>
    <text x="571"  y="92">Check</text>
    <text x="799"  y="92">Decide</text>
    <text x="1027" y="92">Draft</text>
  </g>

  <g font-size="12.5" fill="#94a3b8" text-anchor="middle">
    <text x="115"  y="115">GeM + CPPP portals,</text>
    <text x="115"  y="132">or upload a PDF</text>

    <text x="343"  y="115">800 pages, scanned,</text>
    <text x="343"  y="132">Hindi — page + box</text>

    <text x="571"  y="115">every rule vs what</text>
    <text x="571"  y="132">you actually have</text>

    <text x="799"  y="115">bid / no-bid as a</text>
    <text x="799"  y="132">rupee figure</text>

    <text x="1027" y="115">every sentence tied</text>
    <text x="1027" y="132">to your real data</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="212" y1="103" x2="244" y2="103"/>
    <line x1="440" y1="103" x2="472" y2="103"/>
    <line x1="668" y1="103" x2="700" y2="103"/>
    <line x1="896" y1="103" x2="928" y2="103"/>
  </g>

  <!-- the proof rail -->
  <line x1="20" y1="196" x2="1122" y2="196" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g stroke="#10b981" stroke-width="1.2">
    <line x1="115"  y1="150" x2="115"  y2="192"/>
    <line x1="343"  y1="150" x2="343"  y2="192"/>
    <line x1="571"  y1="150" x2="571"  y2="192"/>
    <line x1="799"  y1="150" x2="799"  y2="192"/>
    <line x1="1027" y1="150" x2="1027" y2="192"/>
  </g>
  <g fill="#10b981">
    <circle cx="115" cy="196" r="3.5"/>
    <circle cx="343" cy="196" r="3.5"/>
    <circle cx="571" cy="196" r="3.5"/>
    <circle cx="799" cy="196" r="3.5"/>
    <circle cx="1027" cy="196" r="3.5"/>
  </g>
  <text x="20" y="222" font-size="13" font-weight="700" fill="#10b981">click-to-proof</text>
  <text x="146" y="222" font-size="13" fill="#94a3b8">every output above clicks back to the exact page and box it came from</text>

  <!-- human checkpoints -->
  <g stroke="#f59e0b" stroke-width="1.4" fill="none" stroke-dasharray="4 3">
    <rect x="476" y="248" width="646" height="54" rx="10"/>
  </g>
  <text x="500" y="271" font-size="13" font-weight="700" fill="#f59e0b">a human has the last word</text>
  <text x="500" y="291" font-size="12.5" fill="#94a3b8">verdicts the system will not guess, the bid decision, every proposal section, and submission</text>

  <!-- the abstain rule -->
  <text x="20" y="271" font-size="13" font-weight="700" fill="#94a3b8">It may say</text>
  <text x="20" y="291" font-size="13" font-weight="700" fill="#94a3b8">&#8220;I don&#8217;t know.&#8221;</text>
  <text x="20" y="311" font-size="12" fill="#94a3b8">It may never guess.</text>
  <line x1="452" y1="248" x2="452" y2="302" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- top label -->
  <text x="20" y="34" font-size="21" font-weight="700" fill="#6366f1">BidProof</text>
  <text x="122" y="34" font-size="14" fill="#94a3b8">— government tenders, read and answered with proof</text>
</svg>
