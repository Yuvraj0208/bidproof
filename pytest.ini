[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole run: the app caches its async engine, and
# per-test loops would strand its pooled connections on a closed loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: needs a live Postgres (docker compose up, or the CI service container)
