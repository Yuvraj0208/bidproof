[project]
name = "bidproof-api"
version = "0.1.0"
description = "BidProof API service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "bidproof-parser",
    "bidproof-adapters",
    "bidproof-scout",
    "bidproof-triage",
    "bidproof-extractor",
    "bidproof-matcher",
    "bidproof-riskscorer",
    "bidproof-decider",
    "bidproof-questionwriter",
    "bidproof-librarian",
    "bidproof-proposalwriter",
    "bidproof-factchecker",
    "bidproof-formfiller",
    "bidproof-guard",
    "minio>=7.2",
    # Pinned to a minor range, not >=: interrupt/Command and the checkpoint
    # saver base class are still moving between minors, and a silent bump
    # would break the Conductor rather than a test.
    "langgraph>=0.6,<0.7",
    "langfuse>=2.50",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Heavy ML parsing engines (Docling; PaddleOCR-VL documented in the parser
# manifest). The licence gate in CI scans these too.
ml = ["bidproof-parser[ml]"]
# Browser-driven scraping (GeM). After install: playwright install chromium
scrapers = ["bidproof-adapters[gem]"]

[tool.uv.sources]
bidproof-parser = { path = "../../agents/parser", editable = true }
bidproof-adapters = { path = "../../adapters", editable = true }
bidproof-scout = { path = "../../agents/scout", editable = true }
bidproof-triage = { path = "../../agents/triage", editable = true }
bidproof-extractor = { path = "../../agents/extractor", editable = true }
bidproof-matcher = { path = "../../agents/matcher", editable = true }
bidproof-riskscorer = { path = "../../agents/riskscorer", editable = true }
bidproof-decider = { path = "../../agents/decider", editable = true }
bidproof-questionwriter = { path = "../../agents/questionwriter", editable = true }
bidproof-librarian = { path = "../../agents/librarian", editable = true }
bidproof-proposalwriter = { path = "../../agents/proposalwriter", editable = true }
bidproof-factchecker = { path = "../../agents/factchecker", editable = true }
bidproof-formfiller = { path = "../../agents/formfiller", editable = true }
bidproof-guard = { path = "../../agents/guard", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pyyaml>=6",
    "pip-licenses>=5",
    "pre-commit>=4",
    # Builds the PDF fixtures the parser tests read, and the rendered page the
    # OCR evaluator scores itself against. Was undeclared, so a clean sync
    # broke collection in 24 test modules at once.
    "reportlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
