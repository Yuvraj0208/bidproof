[project]
name = "bidproof-adapters"
version = "0.1.0"
description = "Isolated portal adapters behind one typed contract, with the SSRF domain guard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
# GeM needs a real browser. Install with:
#   uv sync --project apps/api --extra scrapers
#   uv run --project apps/api playwright install chromium
gem = [
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidproof_adapters"]
