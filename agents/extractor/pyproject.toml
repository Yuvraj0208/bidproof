[project]
name = "bidproof-extractor"
version = "0.1.0"
description = "Extractor agent: dual-path grounded rule extraction with ground-check"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidproof_extractor"]
