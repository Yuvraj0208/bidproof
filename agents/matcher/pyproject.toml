[project]
name = "bidproof-matcher"
version = "0.1.0"
description = "Matcher agent: rule vs capability verdicts — arithmetic first, cited judge second"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidproof_matcher"]
