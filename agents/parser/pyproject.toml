[project]
name = "bidproof-parser"
version = "0.1.0"
description = "Parser agent: PDF to grounded elements via the 4-step reader ladder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
# Heavy ML engines — install explicitly where parsing quality matters:
#   uv sync --project apps/api --extra ml
# PaddleOCR-VL (step 2) additionally needs paddlepaddle + paddleocr; install
# per their platform instructions. The adapter lazy-imports it.
ml = [
    "docling>=2.15",
    # Step 2 of the ladder. Undeclared until now, which meant a plain
    # `uv sync` silently pruned it and every scanned page fell through to
    # "flagged for a human" — with nothing in the logs to say why.
    "rapidocr>=3.0",
    "onnxruntime>=1.17",
    # The OCR evaluator renders known text to a page image and reads it back,
    # so ground truth is exact. Belongs with the OCR engine it measures.
    "reportlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidproof_parser"]
