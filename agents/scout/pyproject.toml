[project]
name = "bidproof-scout"
version = "0.1.0"
description = "Scout agent: run portal adapters in isolation behind the domain guard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bidproof-adapters",
]

[tool.uv.sources]
bidproof-adapters = { path = "../../adapters", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidproof_scout"]
